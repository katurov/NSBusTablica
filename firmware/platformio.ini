; NStupido OLED board v4: Wemos/LOLIN S2 mini + 128x64 I2C OLED (SDA 18, SCL 16), WiFi client of the server.
; WiFi credentials live in secrets.ini (untracked): cp secrets.ini.example secrets.ini
[platformio]
extra_configs = secrets.ini

[env:lolin_s2_mini]
platform = espressif32@6.12.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.30
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DOLED_SDA=18
  -DOLED_SCL=16
  -DOLED_CONTRAST=40
  ; -DOLED_SH1106   ; uncomment if the screen is SH1106 (1.3")
  '-DSERVER_URL="http://nstupido.teamof.top:8080"'
  '-DSTOPS="6539,15889,6712"'
  ${secrets.build_flags}
