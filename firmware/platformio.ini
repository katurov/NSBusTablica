; NStupido OLED board: Wemos/LOLIN S2 mini + 128x64 I2C OLED (SDA 18, SCL 16)
[env:lolin_s2_mini]
platform = espressif32@6.12.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.30
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DOLED_SDA=18
  -DOLED_SCL=16
  -DOLED_CONTRAST=40
  ; -DOLED_SH1106   ; uncomment if the screen is SH1106 (1.3")
