; NStupido boards, both WiFi clients of the server (GET /frame):
;   lolin_s2_mini  Wemos/LOLIN S2 mini + 128x64 I2C OLED (SDA 18, SCL 16)           src/main.cpp    (default env)
;   tdisplay       LilyGO TTGO T-Display, ESP32 + 1.14" ST7789V 135x240 colour IPS   src/tdisplay.cpp
; WiFi credentials live in secrets.ini (untracked): cp secrets.ini.example secrets.ini
; Build/flash: pio run -t upload (S2 mini)   |   pio run -e tdisplay -t upload --upload-port /dev/cu.usbserial-XXXX
[platformio]
extra_configs = secrets.ini
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
platform = espressif32@6.12.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.30
build_src_filter = +<main.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DOLED_SDA=18
  -DOLED_SCL=16
  -DOLED_CONTRAST=40
  ; -DOLED_SH1106   ; uncomment if the screen is SH1106 (1.3")
  '-DSERVER_URL="http://nstupido.teamof.top:8080"'
  '-DSTOPS="6539,15889,6712"'
  ${secrets.build_flags}

[env:tdisplay]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<tdisplay.cpp>
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
build_flags =
  ; TFT_eSPI setup for the T-Display (same as its User_Setups/Setup25_TTGO_T_Display.h), no User_Setup.h edits
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MOSI=19
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=16
  -DTFT_RST=23
  -DTFT_BL=4
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=6000000
  -DTFT_BRIGHTNESS=160
  ; route rows per page: 4 (helvB18) or 5 (helvB14)
  -DTD_ROWS=4
  -DBTN_STOP=0
  -DBTN_PAGE=35
  '-DSERVER_URL="http://nstupido.teamof.top:8080"'
  '-DSTOPS="6539,15889,6712"'
  ${secrets.build_flags}
